name: MyFolioPulse — Daily Reports

on:
  workflow_dispatch:
    inputs:
      timezone:
        description: 'Timezone to run (UAE | EU | UK | US_EAST | US_WEST | ALL)'
        required: false
        default: 'ALL'
  schedule:
    - cron: '0 4 * * *'   # UAE     — 8:00 AM GST  (UTC+4, year-round)
    - cron: '0 6 * * *'   # EU CEST — 8:00 AM CEST (UTC+2, Apr–Oct)
    - cron: '0 7 * * *'   # EU CET  — 8:00 AM CET  (UTC+1, Oct–Apr) + UK BST (UTC+1, Mar–Oct)
    - cron: '0 8 * * *'   # UK GMT  — 8:00 AM GMT  (UTC+0, Oct–Mar)
    - cron: '0 13 * * *'  # US East — 8:00 AM EST  (UTC-5, Nov–Mar)
    - cron: '0 14 * * *'  # US East — 8:00 AM EDT  (UTC-4, Mar–Nov)
    - cron: '0 16 * * *'  # US West — 8:00 AM PST  (UTC-8, Nov–Mar)
    - cron: '0 15 * * *'  # US West — 8:00 AM PDT  (UTC-7, Mar–Nov)

permissions:
  contents: write

jobs:
  generate-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Determine timezone for this run
        id: tz
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "timezone=${{ github.event.inputs.timezone }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            case $HOUR in
              04) echo "timezone=UAE"      >> $GITHUB_OUTPUT ;;
              06) echo "timezone=EU"       >> $GITHUB_OUTPUT ;;
              07) echo "timezone=EU"       >> $GITHUB_OUTPUT ;;
              08) echo "timezone=UK"       >> $GITHUB_OUTPUT ;;
              13) echo "timezone=US_EAST"  >> $GITHUB_OUTPUT ;;
              14) echo "timezone=US_EAST"  >> $GITHUB_OUTPUT ;;
              15) echo "timezone=US_WEST"  >> $GITHUB_OUTPUT ;;
              16) echo "timezone=US_WEST"  >> $GITHUB_OUTPUT ;;
              *)  echo "timezone=NONE"     >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Skip if no timezone matched
        if: steps.tz.outputs.timezone == 'NONE'
        run: |
          echo "No timezone matched for this run hour. Skipping."
          exit 0

      - name: Generate reports
        if: steps.tz.outputs.timezone != 'NONE'
        env:
          SHEET_CSV_URL:      ${{ secrets.SHEET_CSV_URL }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_TIMEZONE:       ${{ steps.tz.outputs.timezone }}
        run: python scripts/generate_reports.py

      - name: Commit and push dashboards
        if: steps.tz.outputs.timezone != 'NONE'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add users/
          git diff --cached --quiet || git commit -m "chore: dashboards $(date +'%Y-%m-%d %H:%M UTC')"
          git push
